
@switch (step()) {
  @case (1) {

        <auth-wrapper>
          <app-form-layout  [formGroup]="forgetPasswordForm"  [formtitle]="'Forget Password'" [formsubtitle]="'Enter Your Email'"    >

                <custom-input formControlName="email" [label]="'Email'" [type]="'email'" [placeholder]="'Enter your Email'" [icon]="'pi pi-envelope'" inputs ></custom-input>
        
              <custom-button [label]="'Send OTP'" [disabled]="!forgetPasswordForm.get('email')?.valid" (onClick)="OnSubmit()" [isloading]="isloading()" submit ></custom-button>
        
          </app-form-layout>
        </auth-wrapper>

  }

  @case (2) {
    <app-otp (onStepChange)="changeStep($event)"></app-otp>
  }
  @case (3) {
    <app-new-password ></app-new-password>
  }
}
